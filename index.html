  <!DOCTYPE html>
<html>

<head>
  <title>Chris' Business Card</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <div class="card" id="businessCard">
      <div class="card-inner">
        <div class="card-face card-front">
          <img src="assets/chiikawa.png" alt="Chiikawa Studying" style="width: 80px; height: auto;" />
          <!-- <p>Designer</p> -->
          <h1>Chris Hamamoto</h1>
        </div>
        <div class="card-face card-back">
          <h2>Contact</h2>
          <p>chamamoto@snu.ac.kr</p>
          <p>@hamamoto</p>
        </div>
      </div>
    </div>
  <footer>
    <script>
      const card = document.getElementById('businessCard');
      card?.addEventListener('click', () => {
        card.classList.toggle('is-flipped');
      });
    </script>
  </footer>
</body>

</html>
